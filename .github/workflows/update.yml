name: Update museum exhibitions
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_exhibitions.py
      - name: Commit updated data
        run: |
          git config user.name "museum-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/exhibitions.json
          git diff --cached --quiet || git commit -m "chore: update exhibition data"
          git push
